services:
  # ─────────────────────────────────────────────
  # PostgreSQL with pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:latest
    container_name: voice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-voice_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-voice_pass_2026}
      POSTGRES_DB: ${DB_NAME:-voice_ordering}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-voice_user} -d ${DB_NAME:-voice_ordering}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - voice-network

  # ─────────────────────────────────────────────
  # Redis (Session + Cache)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voice-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - voice-network

  # ─────────────────────────────────────────────
  # 🆕 FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-backend
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-voice_ordering}
      DB_USER: ${DB_USER:-voice_user}
      DB_PASSWORD: ${DB_PASSWORD:-voice_pass_2026}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2026}
      # App
      DEBUG: ${DEBUG:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_PORT: 8000
      # Sync
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      RESTAURANT_ENGINE_BASE_URL: ${RESTAURANT_ENGINE_BASE_URL:-}
      RESTAURANT_ENGINE_API_KEY: ${RESTAURANT_ENGINE_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voice-network

  # ─────────────────────────────────────────────
  # pgAdmin (Optional — development only)
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: voice-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@voice.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voice-network

  # ─────────────────────────────────────────────
  # Redis Insight (Optional — development)
  # ─────────────────────────────────────────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: voice-redis-insight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voice-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  redis_insight_data:

networks:
  voice-network:
    driver: bridge
